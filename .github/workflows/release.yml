name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build C4D preview helper
        if: ${{ hashFiles('apps/desktop/src-tauri/third_party/cineware/lib/cinewarelib_release.lib') != '' }}
        shell: cmd
        working-directory: apps/desktop/src-tauri
        run: |
          if not exist bin\c4d mkdir bin\c4d
          cl /nologo /std:c++17 /EHsc /MT /O2 /DNDEBUG /D_CRT_SECURE_NO_WARNINGS /Ithird_party\cineware\includes /Fo%TEMP%\c4d_preview.obj /Fe:bin\c4d\c4d_preview.exe ..\..\..\tools\c4d_preview\main.cpp /link /LIBPATH:third_party\cineware\lib cinewarelib_release.lib jpeglib_release.lib ws2_32.lib winmm.lib
          if not exist bin\c4d\c4d_preview.exe (echo Missing c4d_preview.exe & exit /b 1)

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm --filter @polystash/desktop build
        working-directory: apps/desktop

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: polystash-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: polystash-windows
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.exe
