name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build C4D preview helper
        if: ${{ hashFiles('apps/desktop/src-tauri/third_party/cineware/lib/cinewarelib_release.lib') != '' }}
        shell: cmd
        working-directory: apps/desktop/src-tauri
        run: |
          if not exist bin\c4d mkdir bin\c4d
          cl /nologo /std:c++17 /EHsc /MT /O2 /DNDEBUG /D_CRT_SECURE_NO_WARNINGS /Ithird_party\cineware\includes /Fo%TEMP%\c4d_preview.obj /Fe:bin\c4d\c4d_preview.exe ..\..\..\tools\c4d_preview\main.cpp /link /LIBPATH:third_party\cineware\lib cinewarelib_release.lib jpeglib_release.lib ws2_32.lib winmm.lib ole32.lib
          if not exist bin\c4d\c4d_preview.exe (echo Missing c4d_preview.exe & exit /b 1)

      - name: Build SBSAR renderer
        shell: cmd
        working-directory: apps/desktop/src-tauri
        run: |
          if not exist bin\sbsar mkdir bin\sbsar
          cl /nologo /std:c++17 /EHsc /MD /O2 /DNDEBUG /D_CRT_SECURE_NO_WARNINGS /Ithird_party\substance\include /Ithird_party\substance\stb /Fo%TEMP%\sbsar_render.obj /Fe:bin\sbsar\sbsar_render.exe ..\..\..\tools\sbsar_render\main.cpp /link /LIBPATH:third_party\substance\lib substance_framework.lib substance_linker.lib substance_sse2_blend.lib tinyxml.lib
          if not exist bin\sbsar\sbsar_render.exe (echo Missing sbsar_render.exe & exit /b 1)
          copy /Y third_party\substance\bin\substance_linker.dll bin\sbsar\ >nul
          copy /Y third_party\substance\bin\substance_sse2_blend.dll bin\sbsar\ >nul
          echo Built bin\sbsar\sbsar_render.exe
      - name: Smoke test SBSAR renderer
        shell: cmd
        working-directory: apps/desktop/src-tauri
        run: |
          if exist "%TEMP%\sbsar_smoke" rmdir /s /q "%TEMP%\sbsar_smoke"
          bin\sbsar\sbsar_render.exe third_party\substance\sample.sbsar "%TEMP%\sbsar_smoke"
          if errorlevel 1 (echo SBSAR smoke render failed & exit /b 1)
          if not exist "%TEMP%\sbsar_smoke\*.png" (echo No SBSAR PNG produced & exit /b 1)
          dir /b "%TEMP%\sbsar_smoke\*.png"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm --filter @polystash/desktop build
        working-directory: apps/desktop

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: polystash-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: polystash-windows
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.exe
