name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

# Cancel superseded workflow runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Note: vite:build in apps/desktop already executes "tsc -b && vite build",
      # validating all TypeScript types before generating the Vite build.
      - name: Build frontend bundle
        run: pnpm --filter @polystash/desktop vite:build

  # ── Rust backend ──────────────────────────────────────────────────────────
  rust:
    name: Rust (Clippy + Checks)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build C4D preview helper
        if: ${{ hashFiles('apps/desktop/src-tauri/third_party/cineware/lib/cinewarelib_release.lib') != '' }}
        shell: cmd
        working-directory: apps/desktop/src-tauri
        run: |
          if not exist bin\c4d mkdir bin\c4d
          cl /nologo /std:c++17 /EHsc /MT /O2 /DNDEBUG /D_CRT_SECURE_NO_WARNINGS /Ithird_party\cineware\includes /Fo%TEMP%\c4d_preview.obj /Fe:bin\c4d\c4d_preview.exe ..\..\..\tools\c4d_preview\main.cpp /link /LIBPATH:third_party\cineware\lib cinewarelib_release.lib jpeglib_release.lib ws2_32.lib winmm.lib ole32.lib
      - name: Verify C4D preview helper
        if: ${{ hashFiles('apps/desktop/src-tauri/third_party/cineware/lib/cinewarelib_release.lib') != '' }}
        shell: cmd
        working-directory: apps/desktop/src-tauri
        run: |
          if not exist bin\c4d\c4d_preview.exe (echo Missing c4d_preview.exe & exit /b 1)
          echo Built bin\c4d\c4d_preview.exe
      - name: Build SBSAR renderer
        shell: cmd
        working-directory: apps/desktop/src-tauri
        run: |
          if not exist bin\sbsar mkdir bin\sbsar
          cl /nologo /std:c++17 /EHsc /MD /O2 /DNDEBUG /D_CRT_SECURE_NO_WARNINGS /Ithird_party\substance\include /Ithird_party\substance\stb /Fo%TEMP%\sbsar_render.obj /Fe:bin\sbsar\sbsar_render.exe ..\..\..\tools\sbsar_render\main.cpp /link /LIBPATH:third_party\substance\lib substance_framework.lib substance_linker.lib tinyxml.lib
          if not exist bin\sbsar\sbsar_render.exe (echo Missing sbsar_render.exe & exit /b 1)
          copy /Y third_party\substance\bin\substance_linker.dll bin\sbsar\ >nul
          copy /Y third_party\substance\bin\substance_sse2_blend.dll bin\sbsar\ >nul
          echo Built bin\sbsar\sbsar_render.exe
      - name: Smoke test SBSAR renderer
        shell: cmd
        working-directory: apps/desktop/src-tauri
        run: |
          if exist "%TEMP%\sbsar_smoke" rmdir /s /q "%TEMP%\sbsar_smoke"
          bin\sbsar\sbsar_render.exe third_party\substance\sample.sbsar "%TEMP%\sbsar_smoke"
          if errorlevel 1 (echo SBSAR smoke render failed & exit /b 1)
          if not exist "%TEMP%\sbsar_smoke\*.png" (echo No SBSAR PNG produced & exit /b 1)
          dir /b "%TEMP%\sbsar_smoke\*.png"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
      # cargo clippy already performs full typechecking + borrow checking;
      # running cargo check right before it is redundant compilation work.
      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

