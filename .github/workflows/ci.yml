name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

# Cancel superseded workflow runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Note: vite:build in apps/desktop already executes "tsc -b && vite build",
      # validating all TypeScript types before generating the Vite build.
      - name: Build frontend bundle
        run: pnpm --filter @polystash/desktop vite:build

  # ── Rust backend ──────────────────────────────────────────────────────────
  rust:
    name: Rust (Clippy + Checks)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
      # cargo clippy already performs full typechecking + borrow checking;
      # running cargo check right before it is redundant compilation work.
      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

  # ── Substance SBSAR renderer (optional) ────────────────────────────────────
  # Builds the sidecar that renders real PBR maps for .sbsar files. The Adobe
  # Substance 3D SDK is 158 MB and is not redistributed in this repo, so set the
  # SUBSTANCE_SDK_ROOT secret to a runner that has it (e.g. a self-hosted
  # Windows runner). Without it the job is a no-op and PolyStash falls back to
  # the embedded archive preview / shader ball.
  sbsar-renderer:
    name: Substance renderer (Windows, optional)
    runs-on: windows-latest
    env:
      SUBSTANCE_SDK_ROOT: ${{ secrets.SUBSTANCE_SDK_ROOT }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Build sbsar_preview
        shell: pwsh
        run: |
          if (-not $env:SUBSTANCE_SDK_ROOT) {
            Write-Host "SUBSTANCE_SDK_ROOT is not set; skipping the Substance renderer build."
            exit 0
          }
          cmake -S tools/sbsar_preview -B tools/sbsar_preview/build
          cmake --build tools/sbsar_preview/build --config Release
      - name: Upload renderer
        if: ${{ env.SUBSTANCE_SDK_ROOT != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: polystash-sbsar-renderer
          path: tools/sbsar_preview/build/Release/*
          if-no-files-found: ignore

