[package]
name = "polystash-desktop"
version = "0.1.2"
edition = "2021"

[lib]
name = "polystash_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "polystash-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
notify = "6"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
walkdir = "2"
mime_guess = "2"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", features = ["jpeg", "png", "tiff", "bmp", "gif", "tga", "webp", "exr", "hdr", "avif", "dds"] }
cfb = "0.16"
zip = "9.0.5"
sevenz-rust2 = "0.7"
flate2 = "1"
ag-psd = "0.3"
roxmltree = "0.21"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
trash = "5"
kamadak-exif = "0.6.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
